{% extends 'main/base.html'%}
{% load static %}
{% block title %}Видалення рецепту{% endblock %}
{% block content %}
<div class="container my-4">
    <h1 class="mb-4">Видалення рецептів</h1>
    <h3>Видалити рецепт "{{ recipe.name }}"?</h3>
    <div class="d-flex align-items-center gap-2 mt-4">
        <form method="post" action="{% url 'recipe_delete' recipe.pk %}">
            {% csrf_token %}
            <button
                    class="bg-danger d-inline text-white px-4 py-2 rounded-5 border-0">Так, видалити
            </button>
        </form>
        <a href="{% url 'my_recipes' %}"
           class="bg-success d-inline text-white px-4 py-2 rounded-5 text-decoration-none">Скасувати</a>
    </div>
</div>
{% endblock %}

{% extends "main/base.html" %}
{% block title %}Увійти{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="col-sm-12 col-lg-8 m-auto">
        <h2>Увійти</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn bg-success text-white rounded-5 px-4 py-2">Увійти</button>
        </form>
    </div>
</div>
{% endblock %}
